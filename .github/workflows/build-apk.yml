name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Fugle route and UI regressions
        run: npm run build

      - name: Stage web assets into www/
        run: |
          rm -rf www && mkdir -p www
          cp index.html app.js fugle-api.js security-lookup.js live-stream.js styles.css www/
          [ -d "assets" ] && cp -r assets www/ || true

      - name: Generate Capacitor android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets into android
        run: npx cap sync android

      - name: Set Android package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CODE="$(node -p "const v=require('./package.json').version.split('.').map(Number); v[0]*10000+v[1]*100+v[2]")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -Fq "versionCode $CODE" android/app/build.gradle
          grep -Fq "versionName \"$VERSION\"" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK using app version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/SuperETF-v${VERSION}-debug.apk"
          test -s "dist/SuperETF-v${VERSION}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperETF-v${{ steps.version.outputs.value }}-debug
          path: dist/SuperETF-v${{ steps.version.outputs.value }}-debug.apk
          if-no-files-found: error
